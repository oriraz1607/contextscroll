# Interaction mode:
#   toggle - middle-click scrollable content once to start; any click stops
#   hold   - hold middle over scrollable content and drag; release stops
MODE = toggle

# Safety policy when the accessibility helper is unavailable, stale, or an
# application does not expose the object beneath the pointer.
UNKNOWN_ACTION = native

# Chromium-style per-axis speed curve.
DEADZONE_PX = 15
SPEED_MULTIPLIER = 0.0112
SPEED_EXPONENT = 2.2
MAXIMUM_PX_PER_SECOND = 30000
PIXELS_PER_NOTCH = 55
MAXIMUM_DRAG_PX = 1200
TICK_HZ = 120
NATURAL_SCROLLING = false

SOCKET_PATH = /run/contextscroll/context.sock
