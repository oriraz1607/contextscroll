[package]
name = "contextscroll"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Context-aware middle-button autoscrolling for Linux"
license = "MIT"

[dependencies]
evdev = "0.13.2"
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.53", features = [
    "io-util",
    "macros",
    "net",
    "rt",
    "signal",
    "sync",
    "time",
] }

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
panic = "abort"
strip = true
