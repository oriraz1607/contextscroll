[package]
name = "contextscroll"
version = "0.5.0"
edition = "2024"
rust-version = "1.85"
description = "Context-aware Windows-style middle-click autoscrolling for Linux"
license = "MIT"
repository = "https://github.com/oriraz1607/contextscroll"
readme = "README.md"
keywords = ["linux", "wayland", "autoscroll", "mouse", "accessibility"]

[dependencies]
evdev = "0.13.2"
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.53", features = [
    "io-util",
    "macros",
    "net",
    "rt",
    "signal",
    "sync",
    "time",
] }
zbus = { version = "5.13", default-features = false, features = ["tokio"] }

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
panic = "abort"
strip = true
