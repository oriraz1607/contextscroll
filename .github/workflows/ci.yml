name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  copr-source-package:
    name: RPM packaging
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install RPM tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm cpio libglib2.0-bin

      - name: Test release and COPR RPM layouts
        run: ./scripts/test-rpm.sh

      - name: Build and inspect source RPM
        run: |
          mkdir -p dist
          make -f .copr/Makefile srpm outdir="$PWD/dist" \
            spec="$PWD/packaging/contextscroll-copr.spec"
          srpm=$(find dist -maxdepth 1 -name '*.src.rpm' -print -quit)
          test -n "$srpm"
          rpm -qip "$srpm"

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust 1.85
        run: >-
          rustup toolchain install 1.85.0
          --profile minimal
          --component clippy
          --component rustfmt

      - name: Select Rust 1.85
        run: rustup default 1.85.0

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Lint Rust
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Run tests
        run: ./scripts/test.sh
